# Reflect — production stack on the shared Contabo VPS.
#
# Architecture: Reflect is FULLY INDEPENDENT of bober/swiftmail.
#  - Caddy ingress binds host :443 directly, gets its own Let's Encrypt
#    cert via DNS-01 challenge (Cloudflare API). No reliance on bober's
#    nginx, no docker cp injection that breaks on container recreate.
#  - reflect.swift-mail.app is configured DNS-only in Cloudflare (gray
#    cloud); browsers hit our Caddy directly with a valid TLS cert.
#  - Internal `proxy` network is private to Reflect — not the shared
#    `proxy` net used by bober/swiftmail. Cross-project isolation.
#
# SQLite lives on a docker volume (`reflect_data`) so deploys don't
# nuke patient data. WAL mode is enabled at boot by PrismaService so
# two API replicas can write to the same file without SQLITE_BUSY
# contention.
#
# Zero-downtime deploys: api runs as TWO replicas (api + api_2) behind
# Caddy's load-balancer with active health-checks. Rolling redeploy
# (handled by .github/workflows/deploy.yml) restarts them one at a time,
# so therapists never hit a moment when neither is serving.

# Shared definition for both api replicas — same image, same env, same
# volume mount. Only container_name differs. YAML anchor + merge keeps
# them in lockstep — change one env var, both pick it up.
x-api: &api
  image: reflect/api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment:
    NODE_ENV: production
    API_PORT: 3000
    DATABASE_URL: file:/data/reflect.db
    PROMPTS_DIR: /app/prompts
    LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
    LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-}
    LLM_MODEL_CHAT_FALLBACK: ${LLM_MODEL_CHAT_FALLBACK:-}
    LLM_MODEL_FEEDBACK: ${LLM_MODEL_FEEDBACK:-}
    LLM_MODEL_FEEDBACK_FALLBACK: ${LLM_MODEL_FEEDBACK_FALLBACK:-}
    LLM_MODEL_FEEDBACK_REVIEWER: ${LLM_MODEL_FEEDBACK_REVIEWER:-}
    LLM_MODEL_SKILLS_SYNTHESIZER: ${LLM_MODEL_SKILLS_SYNTHESIZER:-}
    FEEDBACK_MODE: ${FEEDBACK_MODE:-}
    # Internal TTS sidecar — the `reflect_tts` container exposes a tiny
    # FastAPI on port 5050 that fronts Google Gemini TTS (primary) plus
    # edge-tts fallback. Backend TtsService POSTs `{ text, voice, gender }`
    # there; sidecar returns audio/wav (Gemini) or audio/mpeg (edge).
    # Empty/missing var → falls back to browser SpeechSynthesis.
    TTS_BASE_URL: ${TTS_BASE_URL:-http://reflect_tts:5050}
    # Language for supervisor prompts, skill agents, and profiles.
    # 'uk' = Ukrainian (default), 'en' = English (EU market).
    # Loads from prompts/{lang}/ with fallback to prompts/ for missing files.
    REFLECT_LANG: ${REFLECT_LANG:-uk}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
    API_BASE_URL: https://reflect.swift-mail.app
    FRONTEND_URL: https://reflect.swift-mail.app
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
    FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    # Comma-separated bootstrap allow-list. AuthService.reconcileAdmin()
    # ADDITIVELY promotes these emails to admin on login if they aren't
    # already (never demotes). Day-to-day admin management lives in the
    # admin panel — this var is the recovery mechanism if the panel ever
    # loses all admins.
    ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    # Web Push (VAPID). Absent → PushService stays disabled (no crash, no
    # reminders). Injected into /opt/reflect/.env by the deploy workflow from
    # GitHub Actions secrets. The private key never lives in the repo.
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@reflect.swift-mail.app}
    # OmniVoice (self-hosted TTS on a GPU box, reached via a Cloudflare
    # tunnel + share PIN). Both unset → TtsService silently uses the
    # Gemini/edge sidecar (no behaviour change). Synced into
    # /opt/reflect/.env by the deploy workflow from GitHub secrets.
    OMNIVOICE_URL: ${OMNIVOICE_URL:-}
    OMNIVOICE_PIN: ${OMNIVOICE_PIN:-}
  volumes:
    - reflect_data:/data
  # 120s drain budget for SIGTERM → SIGKILL. Inside, the app does:
  #  - 6s LB drain (so Caddy marks unhealthy)
  #  - app.close() and lifecycle hooks (~instant)
  #  - up to 110s waiting for active SSE feedback streams to finish
  # If the feedback stream is somehow stuck past 110s, Docker SIGKILLs
  # at 120s — which is still better than the old behaviour where any
  # in-flight stream was killed instantly.
  stop_grace_period: 120s
  healthcheck:
    # Hit /api/health which returns 503 when shutdown started → Docker
    # marks unhealthy → matches the LB's view. 200 = ready to serve.
    test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s

services:
  api:
    <<: *api
    container_name: reflect_api

  api_2:
    <<: *api
    container_name: reflect_api_2

  # Self-hosted TTS sidecar (v2). Primary path = Google Gemini 2.5 Flash
  # TTS (voices Aoede/Kore/Leda — significantly better Ukrainian prosody
  # than edge-tts). Fallback = open-source `edge-tts` package speaking
  # to Microsoft's "Read Aloud" WebSocket endpoint (Polina/Sonia/Denise)
  # — kept as safety net for when Gemini errors or hits rate limits.
  #
  # GEMINI_API_KEY from .env enables Gemini path; absent → edge-only.
  # TTS_PROVIDER controls behaviour:
  #   - auto    (default): Gemini primary, edge fallback on error
  #   - gemini : Gemini only (502 if key missing or call fails)
  #   - edge   : edge-tts only (legacy)
  #
  # Only the api containers talk to it via the private docker network;
  # the host never publishes its port.
  tts:
    image: reflect/tts:${IMAGE_TAG:-latest}
    build:
      context: ./deploy/tts
    container_name: reflect_tts
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5050/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    image: reflect/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: reflect_web
    restart: unless-stopped
    depends_on:
      - api

  # Periodic SQLite backup. Snapshots /data/reflect.db every 6 hours
  # using sqlite3's online .backup (safe with WAL, no need to stop the
  # app) and keeps a rolling window of 28 backups (≈ last 7 days). Each
  # snapshot is gzipped — typical db is ~1 MB, compresses to ~300 KB.
  #
  # If a therapist accidentally discards a session, we can pluck the
  # most recent pre-incident backup, mount it as a temporary read-only
  # source, and copy the missing Session + Message rows into the live
  # DB. Procedure documented in docs/runbooks/restore-deleted-session.md
  # (alongside this commit).
  db_backup:
    image: alpine:3.20
    container_name: reflect_db_backup
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - reflect_data:/data:ro             # read-only: we never write to live DB
      - reflect_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite gzip > /dev/null
        echo "db_backup: running every 6h, retaining 28 snapshots"
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S)
          out=/backups/reflect-$$ts.db
          # `.backup` is the SQLite-official online backup API — it
          # iterates pages and is safe against concurrent writers.
          # Reading from a RO mount is fine because .backup opens the
          # source as RO when target is different file.
          if sqlite3 /data/reflect.db ".backup '$$out'"; then
            gzip -9 "$$out"
            echo "db_backup: $$out.gz $(du -h $$out.gz | cut -f1)"
          else
            echo "db_backup: snapshot failed at $$ts"
          fi
          # Prune: keep newest 28 .gz files
          ls -1t /backups/reflect-*.db.gz 2>/dev/null | tail -n +29 | xargs -r rm -f
          sleep 21600
        done

  caddy:
    image: reflect/caddy:${IMAGE_TAG:-latest}
    build:
      context: ./deploy/caddy
    container_name: reflect_caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      # Caddy needs this for the DNS-01 challenge against Cloudflare.
      # See deploy/Caddyfile for usage.
      CADDY_CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Drop-in directory for non-Reflect vhost configs (sibling
      # projects sharing this Caddy ingress). Files are not tracked
      # in git so they survive `git pull`. The main Caddyfile pulls
      # them via `import /etc/caddy/conf.d/*.caddy`.
      - ./deploy/caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - api_2
      - web

volumes:
  reflect_data:
  reflect_backups:  # SQLite snapshot history — see db_backup service.
  caddy_data:       # Caddy's auto-issued cert + ACME state lives here.
  caddy_config:

# Private network — only reflect's containers. NOT the shared `proxy`
# network used by bober/swiftmail. Caddy resolves `reflect_api`,
# `reflect_api_2`, and `reflect_web` by container name on this net.
networks:
  default:
    name: reflect_net
    driver: bridge
