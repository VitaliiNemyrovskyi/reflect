name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/reflect

            echo "=== Pull ==="
            git pull origin main

            # Build only api + web — these change every commit. Caddy
            # builds from ./deploy/caddy and rarely changes; rebuilding
            # it each deploy would bump its image hash, which makes
            # `docker compose up -d caddy` recreate the container and
            # introduces a ~4-5s blip. Skip the rebuild so Caddy stays
            # untouched on routine deploys. When Caddy itself needs to
            # change (e.g. new plugin in xcaddy), run a one-off
            # `docker compose build caddy && docker compose up -d caddy`
            # by hand — that's a rare event.
            echo "=== Build ==="
            docker compose -f docker-compose.prod.yml build api web

            # Helper: wait until the named container reports healthy.
            # Polls every 5s, gives up after 18 tries (90s). Fails the
            # whole deploy on timeout so we don't proceed to restarting
            # the second replica if the first never came back.
            wait_healthy() {
              local name="$1"
              for i in $(seq 1 18); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$name" 2>/dev/null || echo "missing")
                echo "  $name attempt $i: $STATUS"
                if [ "$STATUS" = "healthy" ]; then
                  return 0
                fi
                sleep 5
              done
              echo "=== $name failed to become healthy ==="
              docker logs "$name" --tail 50
              return 1
            }

            # Step 1: Ensure api_2 exists and is healthy BEFORE touching
            # the existing api. On the very first run of this workflow
            # api_2 doesn't exist yet — create it now so there's a healthy
            # replica to absorb traffic when we restart api below.
            # On subsequent runs, `up -d` only recreates if the image or
            # config changed (idempotent no-op otherwise).
            echo "=== Ensure api_2 ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps api_2
            wait_healthy reflect_api_2

            # Step 2: Caddy config sync.
            #
            # Two layers:
            #   a) `up -d caddy` — compose recreates the container only
            #      if its definition changed (image, env, volumes, etc.).
            #      Pure Caddyfile-content changes don't trigger this
            #      because the file is bind-mounted live. This catches
            #      volume / mount additions (e.g. when we first added
            #      the conf.d/ drop-in directory) that hot-reload alone
            #      cannot pick up.
            #   b) `caddy reload` — hot-reloads the in-memory config
            #      without dropping connections. Picks up Caddyfile and
            #      conf.d/*.caddy edits done between deploys.
            #
            # (a) costs a brief connection drop ONLY when the Caddy
            # service definition genuinely changed — rare after stable
            # setup. (b) is the every-deploy path and is zero-downtime.
            echo "=== Caddy sync ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy
            docker exec reflect_caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              && echo "  hot-reloaded" \
              || echo "  reload skipped (container may have just restarted)"

            # Step 3: Rolling restart of api. api_2 keeps serving while
            # api's graceful-shutdown drains active feedback streams
            # (up to 110s) and the new container boots.
            echo "=== Rolling redeploy: api ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            wait_healthy reflect_api

            # Step 4: Now restart api_2 with the new image too. api keeps
            # serving during this swap. If api_2 was already on the new
            # image from step 1, this is a no-op.
            echo "=== Rolling redeploy: api_2 ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps api_2
            wait_healthy reflect_api_2

            # Step 5: Static SPA. Browsers cache the Angular bundle so an
            # existing session doesn't refetch during the brief restart.
            # Caddy's lb_try_duration retries any in-flight web request.
            echo "=== Web ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans web

            echo "=== Done: $(git log --oneline -1) ==="
